<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Studio - PS</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#C17D4A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Studio" />
    <link rel="apple-touch-icon" href="/wonder-coin-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/wonder-coin-192.png" />

    <style>
      /* The document itself never scrolls. Every screen manages its own
         overflow, so any movement at this level is the browser repositioning
         the page — which is what makes a chat jump when the keyboard opens.

         overflow: hidden rather than position: fixed. Fixing the body takes it
         out of flow and the page renders somewhere unreachable. */
      html, body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #root { height: 100%; }

      /* iOS magnifies the page when a focused field is smaller than 16px.
         That is what made the screen grow and slide sideways when the keyboard
         opened -- not scrolling, which is why nothing about scroll behaviour
         fixed it. 16 is a browser threshold, not a design choice.

         Set here rather than field by field so a new input added later cannot
         reintroduce it. */
      input, textarea, select {
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
