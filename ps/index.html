<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/wondercoin-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Personal Space</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#C17D4A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Personal Space" />
    <link rel="apple-touch-icon" href="/wonder-coin-192.png" />

    <style>
      /* Only rubber-banding is suppressed here. An earlier version also set
         overflow: hidden on the body to stop the chat jumping when the
         keyboard opened -- but that applies to every page, and the pages
         outside the app shell have no scrolling container of their own. Sign
         up became impossible to complete on a phone: the form ran past the
         bottom of the screen with no way to reach the rest of it.

         The shell locks its own overflow. Anything not inside it -- sign up,
         sign in, the policy pages -- scrolls like an ordinary page, which is
         what it is. */
      html, body {
        margin: 0;
        min-height: 100%;
        overscroll-behavior-y: none;
      }

      /* iOS magnifies the page when a focused field is smaller than 16px.
         That is what made the screen grow and slide sideways when the keyboard
         opened -- not scrolling, which is why nothing about scroll behaviour
         fixed it. 16 is a browser threshold, not a design choice.

         Set here rather than field by field so a new input added later cannot
         reintroduce it. */
      input, textarea, select {
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
