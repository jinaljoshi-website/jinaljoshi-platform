<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <title>Wonder Coin</title>
  <desc>Gold coin with the letter J embossed in the centre — official symbol of the Wonder Coin</desc>

  <defs>
    <radialGradient id="face-grad" cx="38%" cy="35%" r="62%">
      <stop offset="0%"   stop-color="#faeaa0"/>
      <stop offset="28%"  stop-color="#e8b830"/>
      <stop offset="62%"  stop-color="#d09618"/>
      <stop offset="100%" stop-color="#a87010"/>
    </radialGradient>
    <radialGradient id="rim-grad" cx="38%" cy="35%" r="62%">
      <stop offset="0%"   stop-color="#d4960e"/>
      <stop offset="50%"  stop-color="#a07010"/>
      <stop offset="100%" stop-color="#704a08"/>
    </radialGradient>
    <radialGradient id="mid-grad" cx="38%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#f0c840"/>
      <stop offset="55%"  stop-color="#c88a18"/>
      <stop offset="100%" stop-color="#9a6808"/>
    </radialGradient>
    <radialGradient id="field-grad" cx="38%" cy="34%" r="60%">
      <stop offset="0%"   stop-color="#fce890"/>
      <stop offset="40%"  stop-color="#e0a820"/>
      <stop offset="100%" stop-color="#b07810"/>
    </radialGradient>
    <radialGradient id="sheen-grad" cx="30%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#fffef0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fffef0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="60%"  stop-color="#1a0d00" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#1a0d00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="translate(250,250)">

    <!-- Drop shadow -->
    <ellipse cx="6" cy="240" rx="192" ry="18" fill="url(#shadow-grad)"/>

    <!-- Outer rim -->
    <circle r="240" fill="url(#rim-grad)"/>

    <!-- Rim notches — 64 teeth -->
    <g id="n" fill="#7a5008"><rect x="-4.5" y="-240" width="9" height="26" rx="1.5"/></g>
    <use href="#n" transform="rotate(5.625)"/>   <use href="#n" transform="rotate(11.25)"/>
    <use href="#n" transform="rotate(16.875)"/>  <use href="#n" transform="rotate(22.5)"/>
    <use href="#n" transform="rotate(28.125)"/>  <use href="#n" transform="rotate(33.75)"/>
    <use href="#n" transform="rotate(39.375)"/>  <use href="#n" transform="rotate(45)"/>
    <use href="#n" transform="rotate(50.625)"/>  <use href="#n" transform="rotate(56.25)"/>
    <use href="#n" transform="rotate(61.875)"/>  <use href="#n" transform="rotate(67.5)"/>
    <use href="#n" transform="rotate(73.125)"/>  <use href="#n" transform="rotate(78.75)"/>
    <use href="#n" transform="rotate(84.375)"/>  <use href="#n" transform="rotate(90)"/>
    <use href="#n" transform="rotate(95.625)"/>  <use href="#n" transform="rotate(101.25)"/>
    <use href="#n" transform="rotate(106.875)"/> <use href="#n" transform="rotate(112.5)"/>
    <use href="#n" transform="rotate(118.125)"/> <use href="#n" transform="rotate(123.75)"/>
    <use href="#n" transform="rotate(129.375)"/> <use href="#n" transform="rotate(135)"/>
    <use href="#n" transform="rotate(140.625)"/> <use href="#n" transform="rotate(146.25)"/>
    <use href="#n" transform="rotate(151.875)"/> <use href="#n" transform="rotate(157.5)"/>
    <use href="#n" transform="rotate(163.125)"/> <use href="#n" transform="rotate(168.75)"/>
    <use href="#n" transform="rotate(174.375)"/> <use href="#n" transform="rotate(180)"/>
    <use href="#n" transform="rotate(185.625)"/> <use href="#n" transform="rotate(191.25)"/>
    <use href="#n" transform="rotate(196.875)"/> <use href="#n" transform="rotate(202.5)"/>
    <use href="#n" transform="rotate(208.125)"/> <use href="#n" transform="rotate(213.75)"/>
    <use href="#n" transform="rotate(219.375)"/> <use href="#n" transform="rotate(225)"/>
    <use href="#n" transform="rotate(230.625)"/> <use href="#n" transform="rotate(236.25)"/>
    <use href="#n" transform="rotate(241.875)"/> <use href="#n" transform="rotate(247.5)"/>
    <use href="#n" transform="rotate(253.125)"/> <use href="#n" transform="rotate(258.75)"/>
    <use href="#n" transform="rotate(264.375)"/> <use href="#n" transform="rotate(270)"/>
    <use href="#n" transform="rotate(275.625)"/> <use href="#n" transform="rotate(281.25)"/>
    <use href="#n" transform="rotate(286.875)"/> <use href="#n" transform="rotate(292.5)"/>
    <use href="#n" transform="rotate(298.125)"/> <use href="#n" transform="rotate(303.75)"/>
    <use href="#n" transform="rotate(309.375)"/> <use href="#n" transform="rotate(315)"/>
    <use href="#n" transform="rotate(320.625)"/> <use href="#n" transform="rotate(326.25)"/>
    <use href="#n" transform="rotate(331.875)"/> <use href="#n" transform="rotate(337.5)"/>
    <use href="#n" transform="rotate(343.125)"/> <use href="#n" transform="rotate(348.75)"/>
    <use href="#n" transform="rotate(354.375)"/>

    <!-- Main face -->
    <circle r="218" fill="url(#face-grad)"/>

    <!-- Groove rings -->
    <circle r="208" fill="none" stroke="#8a6008" stroke-width="2.5"/>
    <circle r="196" fill="url(#mid-grad)"/>
    <circle r="184" fill="none" stroke="#6a4806" stroke-width="1.8"/>
    <circle r="174" fill="url(#field-grad)"/>
    <circle r="158" fill="none" stroke="#c89020" stroke-width="3.5"/>
    <circle r="148" fill="none" stroke="#a87018" stroke-width="1.2"/>

    <!-- J — shadow layer -->
    <text x="7" y="104" font-size="290" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif" font-weight="bold"
          fill="#5a3400" opacity="0.55" letter-spacing="-4">J</text>

    <!-- J — main -->
    <text x="0" y="98" font-size="290" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif" font-weight="bold"
          fill="#4a2c00" letter-spacing="-4">J</text>

    <!-- J — highlight -->
    <text x="-6" y="91" font-size="290" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif" font-weight="bold"
          fill="#fce890" opacity="0.38" letter-spacing="-4">J</text>

    <!-- Surface sheen -->
    <ellipse cx="-72" cy="-88" rx="102" ry="54"
             fill="url(#sheen-grad)" transform="rotate(-38 -72 -88)"/>
    <ellipse cx="-90" cy="-118" rx="28" ry="14"
             fill="#fffef8" opacity="0.22" transform="rotate(-38 -90 -118)"/>

    <!-- Edge lines -->
    <circle r="218" fill="none" stroke="#c89020" stroke-width="1"/>
    <circle r="240" fill="none" stroke="#8a6010" stroke-width="1.5"/>

  </g>
</svg>
